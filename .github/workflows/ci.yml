jobs:
  kodem-scan:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "fake Kodem scan (SCA + SAST)"
          sleep 60
          echo ok
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "fake build"
          sleep 60
          echo ok
  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a.txt and b.txt are both present
        run: |
          sleep 60
          if [ -f a.txt ] && [ -f b.txt ]; then
            echo "FAIL: a.txt and b.txt cannot exist together"
            exit 1
          fi
          echo ok
  korvette:
